services:

  # ── Node.js 后端 ────────────────────────────────────────────────────
  chat:
    build:
      context: .
      dockerfile: Dockerfile
    image: chat-node:latest
    container_name: chat-node
    restart: unless-stopped

    ports:
      - "30001:8881"

    volumes:
      - ./data:/app/data

    environment:
      PORT:           "8881"
      ADMIN_KEY:      "${ADMIN_KEY}"
      JWT_SECRET:     "${JWT_SECRET}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-30d}"
      SHARE_STORAGE_DRIVER: "${SHARE_STORAGE_DRIVER:-local}"
      QINIU_ACCESS_KEY: "${QINIU_ACCESS_KEY:-}"
      QINIU_SECRET_KEY: "${QINIU_SECRET_KEY:-}"
      QINIU_BUCKET: "${QINIU_BUCKET:-}"
      QINIU_DOMAIN: "${QINIU_DOMAIN:-}"
      QINIU_ZONE: "${QINIU_ZONE:-}"
      QINIU_DOWNLOAD_EXPIRES_SECONDS: "${QINIU_DOWNLOAD_EXPIRES_SECONDS:-300}"
      QINIU_DIRECT_UPLOAD_MAX_BYTES: "${QINIU_DIRECT_UPLOAD_MAX_BYTES:-10737418240}"
      QINIU_DIRECT_UPLOAD_TOKEN_EXPIRES_SECONDS: "${QINIU_DIRECT_UPLOAD_TOKEN_EXPIRES_SECONDS:-7200}"
      QINIU_UPLOAD_HOST: "${QINIU_UPLOAD_HOST:-}"

    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "require('http').get('http://localhost:8881/api/health',
          r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
