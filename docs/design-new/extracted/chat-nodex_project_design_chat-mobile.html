<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nodex · Chat (mobile)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 16px;
      background:
        radial-gradient(1200px 600px at 50% -10%, var(--bg-2), var(--bg));
    }
    .phone-row { display: flex; gap: 32px; flex-wrap: wrap; justify-content: center; }
    .phone {
      width: 375px; height: 812px;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: 36px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      position: relative;
    }
    .phone iframe {
      width: 100%; height: 100%; border: none; display: block;
    }
    .label {
      text-align: center; margin-top: 12px;
      font-size: 12px; color: var(--text-2); letter-spacing: 0.04em;
    }
    .notch {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 130px; height: 24px;
      background: var(--bg);
      border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;
      z-index: 10;
      pointer-events: none;
    }
    .header { text-align: center; margin-bottom: 32px; }
    .header h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px; }
    .header p { color: var(--text-2); margin: 0; }
    .row { display: flex; flex-direction: column; align-items: center; }
  </style>
</head>
<body>
  <div>
    <div class="header">
      <h1>Mobile preview · 375 × 812</h1>
      <p>Sidebar collapses into a drawer with scrim. Connection status shrinks to a dot. dvh-based layout.</p>
    </div>
    <div class="phone-row">
      <div class="row">
        <div class="phone">
          <div class="notch"></div>
          <iframe src="chat.html?theme=light" title="Mobile light"></iframe>
        </div>
        <div class="label">Light · default view</div>
      </div>
      <div class="row">
        <div class="phone">
          <div class="notch"></div>
          <iframe src="chat.html?theme=dark" title="Mobile dark"></iframe>
        </div>
        <div class="label">Dark · default view</div>
      </div>
    </div>
  </div>

  <button class="theme-fab" onclick="toggleTheme()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    <span data-theme-label>Light</span>
  </button>
  <script src="theme.js"></script>
  <script>
    // Sync child iframe theme via URL — they're independent docs
  </script>
</body>
</html>
