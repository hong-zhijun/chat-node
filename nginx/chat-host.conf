# ════════════════════════════════════════════════════════════════════
# Nodex 私聊系统 — 宿主机 Nginx 配置（配合 certbot --nginx 使用）
#
# 部署步骤：
#   1. 把本文件复制到 /etc/nginx/sites-available/chat-node
#   2. ln -s /etc/nginx/sites-available/chat-node /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#   4. certbot --nginx -d your-domain.com      ← certbot 自动补全 SSL 部分
#
# 注意：upstream 指向 Docker 绑到回环的端口
# ════════════════════════════════════════════════════════════════════

upstream chat_backend {
    server 127.0.0.1:8881;
    keepalive 32;
}

# ────────────────────────────────────────────────────────────────────
# HTTP — certbot 验证 + 跳转 HTTPS
# （certbot --nginx 会自动在此块里追加 return 301，无需手动写）
# ────────────────────────────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name your-domain.com;    # ← 改为你的域名

    # certbot --nginx 自动在这里加验证 location，不要删这一行注释
    # 如果你先手动加了下面这段，certbot 也能识别并跳过重复添加：
    # location /.well-known/acme-challenge/ {
    #     root /var/www/html;
    # }

    # 其余跳 HTTPS（certbot 会自动添加这条，这里先留着也行）
    location / {
        return 301 https://$host$request_uri;
    }
}

# ────────────────────────────────────────────────────────────────────
# HTTPS — 主配置
# ssl_certificate / ssl_certificate_key 由 certbot --nginx 自动写入
# 下面两行是 certbot 会填入的路径，提前写好也没问题
# ────────────────────────────────────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name your-domain.com;    # ← 改为你的域名

    # ── SSL 证书（certbot --nginx 自动填写 / 维护）──────────────────
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;   # certbot 托管
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;         # certbot 托管

    # ── 上传大小限制（与 multer 保持一致）──────────────────────────
    client_max_body_size 100m;

    # ── gzip 压缩 ────────────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # ── 安全响应头 ──────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                          always;
    add_header X-Frame-Options         "SAMEORIGIN"                       always;
    add_header X-XSS-Protection        "1; mode=block"                    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
    # HSTS（确认 HTTPS 稳定运行后再开启）
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ── WebSocket（/ws）── 必须传 Upgrade 头 ────────────────────────
    location /ws {
        proxy_pass          http://chat_backend;
        proxy_http_version  1.1;

        proxy_set_header    Upgrade     $http_upgrade;
        proxy_set_header    Connection  "upgrade";

        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # WebSocket 长连接，超时拉长
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
    }

    # ── API 接口 ────────────────────────────────────────────────────
    location /api/ {
        proxy_pass          http://chat_backend;
        proxy_http_version  1.1;
        proxy_set_header    Connection        "";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 10s;
    }

    # ── Vite 构建产物（带内容哈希，强缓存 1 年）────────────────────
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|eot|svg|ico|png|webp|avif)$ {
        proxy_pass         http://chat_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection  "";
        proxy_set_header   Host        $host;

        expires            1y;
        add_header         Cache-Control "public, immutable" always;
        access_log         off;
    }

    # ── SPA 其余路由（/, /admin, /login 等）────────────────────────
    location / {
        proxy_pass          http://chat_backend;
        proxy_http_version  1.1;
        proxy_set_header    Connection        "";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        add_header          Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header          Pragma        "no-cache"                            always;
    }
}
