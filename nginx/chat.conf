# ════════════════════════════════════════════════════════════════════
# Nodex 私聊系统 — Nginx 配置
#
# upstream 说明：
#   Docker Compose 部署时用服务名 "chat"（docker 内部网络，推荐）
#   系统 Nginx 直接部署时改为 127.0.0.1:8881
# ════════════════════════════════════════════════════════════════════

upstream chat_backend {
    server chat:8881;           # Docker Compose 内部网络（推荐）
    # server 127.0.0.1:8881;   # 系统 Nginx 直接部署时改用此行

    keepalive 32;               # 复用后端连接，减少 TCP 握手开销
}

# ────────────────────────────────────────────────────────────────────
# HTTP — 强制跳转 HTTPS
# ────────────────────────────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name your-domain.com;    # ← 改为你的域名

    # Let's Encrypt ACME 验证（使用 certbot 时需要）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余全部跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ────────────────────────────────────────────────────────────────────
# HTTPS — 主配置
# ────────────────────────────────────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name your-domain.com;    # ← 改为你的域名

    # ── SSL 证书 ─────────────────────────────────────────────────────
    #
    # 方案 A：Let's Encrypt（推荐，公网域名）
    #   先用 certbot 申请：
    #   certbot certonly --webroot -w /var/www/certbot -d your-domain.com
    #
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    # 方案 B：自签名证书（内网 / 无域名）
    #   生成命令：
    #   openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
    #     -keyout nginx/certs/privkey.pem \
    #     -out    nginx/certs/fullchain.pem \
    #     -subj "/CN=chat-node"
    #
    # 方案 C：商业证书——直接替换上面两个文件路径即可

    # ── TLS 最佳实践 ──────────────────────────────────────────────────
    ssl_session_timeout    1d;
    ssl_session_cache      shared:SSL:10m;
    ssl_session_tickets    off;
    ssl_protocols          TLSv1.2 TLSv1.3;
    ssl_ciphers            ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # HSTS（确认 HTTPS 稳定运行后再开启，否则改错了浏览器会锁死）
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ── 上传大小限制（与 multer 保持一致，可按需调大）────────────────
    client_max_body_size 100m;

    # ── gzip 压缩 ─────────────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # ── 安全响应头 ────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                          always;
    add_header X-Frame-Options         "SAMEORIGIN"                       always;
    add_header X-XSS-Protection        "1; mode=block"                    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;

    # ── WebSocket（/ws）── 最关键：必须传 Upgrade 头 ──────────────────
    location /ws {
        proxy_pass          http://chat_backend;
        proxy_http_version  1.1;

        # WebSocket 握手头
        proxy_set_header    Upgrade     $http_upgrade;
        proxy_set_header    Connection  "upgrade";

        # 透传真实 IP
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # WebSocket 是长连接，超时要拉长（心跳 25s，超时设 1h 足够）
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;
    }

    # ── API 接口 ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass          http://chat_backend;
        proxy_http_version  1.1;
        proxy_set_header    Connection        "";   # keepalive
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 10s;
    }

    # ── Vite 构建产物（文件名含内容哈希，强缓存 1 年）────────────────
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|eot|svg|ico|png|webp|avif)$ {
        proxy_pass          http://chat_backend;
        proxy_http_version  1.1;
        proxy_set_header    Connection  "";
        proxy_set_header    Host        $host;

        # 带哈希的静态资源：永久缓存，immutable 告诉浏览器无需 revalidate
        expires             1y;
        add_header          Cache-Control "public, immutable" always;
        access_log          off;
    }

    # ── SPA 其余路由（/, /admin, /login 等）──────────────────────────
    location / {
        proxy_pass          http://chat_backend;
        proxy_http_version  1.1;
        proxy_set_header    Connection        "";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # index.html 不缓存，确保每次拿到最新版本
        add_header          Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header          Pragma        "no-cache"                            always;
    }
}
